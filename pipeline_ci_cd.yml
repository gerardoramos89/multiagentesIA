```yaml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Deploy to DEV
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/deploy-to-dev@v1
      with:
        server: ${{ secrets.DEV_SERVER }}
        path: dist

  deploy-qa:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Deploy to QA
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/deploy-to-qa@v1
      with:
        server: ${{ secrets.QA_SERVER }}
        path: dist
```

Este archivo de configuración de GitHub Actions define un pipeline de CI/CD para el proyecto. Incluye pasos para la construcción, pruebas y despliegue a entornos de desarrollo (DEV) y de calidad (QA).